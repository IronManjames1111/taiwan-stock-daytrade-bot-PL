name: Unit tests

on:
  push:
    paths:
      - '**.py'
      - 'tests/**'
      - 'requirements*.txt'
      - 'strategy_settings.json'
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
