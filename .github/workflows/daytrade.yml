name: Taiwan Stock Daytrade AI Backtest

on:
  # 原本使用 GitHub 內建的 schedule 觸發不穩定 (可能延遲或被整批跳過)，
  # 改由外部服務 cron-job.org 每 5 分鐘呼叫 GitHub REST API 的方式觸發 workflow_dispatch，
  # 可靠度更高也更好掌控觸發時間。因此這裡移除 schedule，只保留 workflow_dispatch。
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊「Run workflow」，以及 cron-job.org 透過 API 觸發
    inputs:
      risk_mode:
        description: '風險模式：aggressive / conservative / auto / relaxed(實驗性寬鬆模式)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - aggressive
          - conservative
          - relaxed

permissions:
  contents: write # 允許 Actions 把回測報表 commit 並 push 回倉庫

concurrency:
  # 避免高頻率排程與手動觸發同時搶跑、互相衝突 push；同一時間只允許一個 run 在跑，
  # 新的觸發會排隊等待，而不是取消前一個 run（cancel-in-progress: false）。
  group: daytrade-runner
  cancel-in-progress: false

jobs:
  run-trader:
    runs-on: ubuntu-latest

    steps:
      - name: 檢查倉庫代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行本輪次當沖分析（單輪執行，跑完立即結束）
        # 註：actions/checkout 已還原倉庫內既有的 dashboard_state.json / history_records，
        # headless_trader.py 會自動讀取這些檔案接續累積本日的分析狀態。
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          # 排程自動觸發時走 repo variable RISK_MODE（可在 Settings > Secrets and variables > Actions > Variables 設定，預設 auto）
          # 手動點 Run workflow 時，可用下拉選單即時覆蓋（優先權更高）
          RISK_MODE: ${{ inputs.risk_mode || vars.RISK_MODE || 'auto' }}
          # Repository Variables：BROKER_DISCOUNT（如 0.6=六折）、
          # DAY_TRADE_TAX（true=當沖減半 0.15%，false=一般 0.30%）。
          # 未設定時沿用 config.py 的預設值。
          BROKER_DISCOUNT: ${{ vars.BROKER_DISCOUNT || '' }}
          DAY_TRADE_TAX: ${{ vars.DAY_TRADE_TAX || '' }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "本次執行風險模式：$RISK_MODE"
          python headless_trader.py

      - name: 提交並推送回測紀錄至 GitHub
        run: |
          set -e
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 逐一 add，避免任一路徑不存在時 fatal 中斷、連帶讓後面的檔案沒被加入 staging
          # （之前 `git add history_records/ analysis_history.json index.html` 這種一次性寫法，
          #   只要中間任何一個路徑不存在，該指令就會整行失敗，導致排在它後面的 index.html 永遠沒被 commit）
          git add index.html 2>/dev/null || echo "⚠️ index.html 加入 staging 失敗（略過）"
          git add history_records/ 2>/dev/null || echo "ℹ️ history_records/ 無內容可加入（略過）"
          git add analysis_history.json 2>/dev/null || echo "ℹ️ analysis_history.json 不存在（略過，不影響其他檔案）"
          git add dashboard_state.json 2>/dev/null || echo "ℹ️ dashboard_state.json 不存在（略過，不影響其他檔案）"

          echo "── 本次待推送的檔案 ──"
          git status --short

          if git diff --staged --quiet; then
            echo "ℹ️ 目前無新增的回測報表，略過推送步驟。"
            exit 0
          fi

          git commit -m "自動更新當沖回測紀錄 [$(date +'%Y-%m-%d %H:%M')]"

          # ──────────────────────────────────────────────────────────
          # v4.1 修正說明：
          # 舊版 `git pull --rebase origin main || true` 會把 rebase 失敗（常見於高頻率
          # 排程 + concurrency 排隊時，前後兩個 run 都改到 dashboard_state.json /
          # index.html 同一段內容而衝突）的錯誤直接吞掉，導致：
          #   1) rebase 半途卡在 conflict 狀態，working tree 裡的 dashboard_state.json
          #      可能殘留合併標記或半殘內容；
          #   2) 接下來的 git push 因為 non-fast-forward 而被拒絕，本次的分析結果完全
          #      沒有真正寫回 remote main，等於這一整輪的分析被靜默作廢；
          #   3) 下一輪 checkout 抓到的還是舊版狀態，於是 latest_analysis_records 的
          #      累積在使用者看來就像「憑空消失」。
          #
          # 新版改為：rebase 失敗就立刻 abort（絕不留著半殘的 conflict 狀態），改用
          # fetch + push --force-with-lease 搭配重試機制；同時因為 headless_trader.py
          # 本身是「讀取 state → 純累加 → 寫回」的冪等邏輯，就算用最新的 remote 內容
          # 為準也不會遺失資料，遠比讓一次失敗的 rebase 污染檔案來得安全。
          # 失敗時明確印出錯誤、以非 0 結束，讓 workflow 顯示失敗，方便從 Actions
          # 頁面直接發現問題，而不是像舊版一樣悄悄放棄。
          # ──────────────────────────────────────────────────────────
          MAX_RETRY=5
          for i in $(seq 1 $MAX_RETRY); do
            echo "── 第 $i/$MAX_RETRY 次嘗試推送 ──"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin main; then
                echo "✅ 已成功推送 index.html 等最新回測紀錄（第 $i 次嘗試）"
                exit 0
              else
                echo "⚠️ push 被拒絕（可能又有新的 remote 變更），中止本次 rebase 結果並重試..."
                git rebase --abort 2>/dev/null || true
              fi
            else
              echo "⚠️ rebase 發生衝突，中止 rebase 避免留下半殘檔案，稍後重試..."
              git rebase --abort 2>/dev/null || true
            fi

            if [ "$i" -lt "$MAX_RETRY" ]; then
              sleep $((RANDOM % 10 + 5))  # 隨機延遲 5~14 秒再重試，降低多個 run 同時搶跑的碰撞機率
            fi
          done

          echo "❌ 已重試 $MAX_RETRY 次仍無法推送，本輪次分析結果可能未寫回 GitHub，請檢查 Actions 紀錄！"
          exit 1
