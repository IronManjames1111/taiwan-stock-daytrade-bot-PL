name: Taiwan Stock Daytrade Technical Strategy

on:
  # 由外部服務 cron-job.org 呼叫 GitHub REST API 觸發（比內建 schedule 穩定）。
  #
  # 兩種用法（擇一）：
  #  A. single（預設）：cron-job.org 週一~週五 08:50~13:30 每 5 分鐘觸發，每次只跑一輪。
  #  B. loop（建議）  ：cron-job.org 只需週一~週五 08:50 觸發「一次」，並帶 inputs {"run_mode":"loop"}；
  #                     job 內自己每 60 秒跑一輪，直到 13:32，並每 5 分鐘推送一次網站。
  #                     1 分 K 策略就該搭配 1 分鐘的判斷頻率，而不是 5 分鐘。
  workflow_dispatch:
    inputs:
      risk_mode:
        description: '風險模式：auto=完全依 strategy_settings.json；aggressive / conservative / relaxed 會覆蓋部分門檻'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - aggressive
          - conservative
          - relaxed
      run_mode:
        description: '執行模式：single=只跑一輪；loop=單一 job 內每 60 秒一輪直到收盤'
        required: false
        default: 'single'
        type: choice
        options:
          - single
          - loop
      force_run:
        description: '手動測試用：忽略交易日 / 交易時段檢查（夜間或假日測試連線請勾選）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write # 允許把看板與交易紀錄 commit 回倉庫

concurrency:
  # 同一時間只允許一個 run；新的觸發排隊等待，不取消進行中的 run。
  group: daytrade-runner
  cancel-in-progress: false

env:
  TZ: Asia/Taipei # 讓 shell 的 date（commit 訊息）使用台灣時間

jobs:
  run-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 上限保險；實際由下方 timeout 指令依模式限制

    steps:
      - name: 檢查倉庫代碼（淺層，只拉最新一份）
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 先判斷「今天是不是交易日、現在是不是交易時段」，不是就直接結束，
      # 不用安裝套件、也不會在假日 / 夜間白跑與 commit。這一步只用標準函式庫。
      - name: 交易日 / 交易時段檢查
        id: gate
        env:
          FORCE_RUN: ${{ inputs.force_run }}
        run: python3 market_calendar.py gate

      - name: 設定 Python 3.11 環境
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: 執行技術策略分析
        if: steps.gate.outputs.run == 'true'
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          # 排程觸發走 repo variable RISK_MODE（預設 auto）；手動點 Run workflow 的下拉選單優先
          RISK_MODE: ${{ inputs.risk_mode || vars.RISK_MODE || 'auto' }}
          RUN_MODE: ${{ inputs.run_mode || vars.RUN_MODE || 'single' }}
          FORCE_RUN: ${{ inputs.force_run }}
          # 以下為選填的 repo variables（Settings > Secrets and variables > Actions > Variables）
          BROKER_DISCOUNT: ${{ vars.BROKER_DISCOUNT }}
          IS_DAY_TRADE_TAX: ${{ vars.IS_DAY_TRADE_TAX }}
          DAILY_CAPITAL: ${{ vars.DAILY_CAPITAL }}   # 每日本金（元）；留空則用 strategy_settings.json 的 daily_capital（預設 1,000,000）
          PYTHONUNBUFFERED: "1"
        run: |
          echo "風險模式：$RISK_MODE｜執行模式：$RUN_MODE"
          if [ "$RUN_MODE" = "loop" ]; then LIMIT=19800; else LIMIT=600; fi
          timeout "$LIMIT" python headless_trader.py

      # always()：就算上一步失敗（例如渲染或網路錯誤），已經存好的狀態與進場紀錄仍要推送，
      # 不能因為前一步失敗就整輪作廢。
      - name: 提交並推送交易紀錄
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        run: bash scripts/commit_push.sh
