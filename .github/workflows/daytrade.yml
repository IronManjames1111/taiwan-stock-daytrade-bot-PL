name: Taiwan Stock Daytrade AI Backtest

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週五早上 08:55 啟動 (換算 UTC 為 00:55)
    - cron: '55 0 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊「Run workflow」隨時測試

permissions:
  contents: write # 允許 Actions 把回測報表 commit 並 push 回倉庫

jobs:
  run-trader:
    runs-on: ubuntu-latest

    steps:
      - name: 檢查倉庫代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行當沖自動分析與收盤回測
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          python headless_trader.py

      - name: 提交並推送回測紀錄至 GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history_records/ analysis_history.json index.html || true
          if git diff --staged --quiet; then
            echo "ℹ️ 目前無新增的回測報表，略過推送步驟。"
          else
            git commit -m "自動更新當沖回測紀錄 [$(date +'%Y-%m-%d')]"
            git push origin main
          fi
