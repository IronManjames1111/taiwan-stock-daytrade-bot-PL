<!-- dashboard_ui v25：分頁導覽 + 高級質感樣式。由 headless_trader.render_html_dashboard 在寫出 index.html 前注入 -->
<style id="ui-v25">
body{background:radial-gradient(900px 480px at 8% -8%,rgba(77,141,255,.14),transparent 60%),radial-gradient(800px 460px at 100% 0,rgba(255,84,112,.08),transparent 55%),#0a0e14!important;letter-spacing:.01em}
#main-content{position:relative;max-width:1280px;margin:0 auto;width:100%}
.panel,.panel-raised{border-radius:16px!important;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.7);transition:border-color .2s,transform .2s}
.panel:hover{border-color:#2c3849!important}
.data-card{border-radius:12px;transition:transform .15s,border-color .15s}.data-card:hover{transform:translateY(-1px);border-color:#34415a}
.mono,table td,table th{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#26303f;border-radius:8px}
#ui-tabs{position:sticky;top:0;z-index:30;margin:14px 0 16px;padding:6px;display:flex;align-items:center;gap:4px;border:1px solid #202834;border-radius:14px;background:rgba(16,22,31,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 32px -16px #000}
#ui-tabs .tb{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}#ui-tabs .tb::-webkit-scrollbar{display:none}
#ui-tabs button{position:relative;border:0;background:transparent;color:#8b93a1;font:600 13px/1 'Noto Sans TC',sans-serif;padding:10px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
#ui-tabs button:hover{color:#dde3ea;background:rgba(255,255,255,.04)}
#ui-tabs button.on{color:#fff;background:linear-gradient(180deg,rgba(77,141,255,.22),rgba(77,141,255,.08));box-shadow:0 0 0 1px rgba(77,141,255,.45) inset}
#ui-tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-7px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#4d8dff,transparent)}
#ui-tabs .rf{font:500 11px 'JetBrains Mono',ui-monospace,monospace;color:#8b93a1;padding:0 10px;white-space:nowrap;display:flex;align-items:center;gap:6px}
#ui-tabs .rf i{width:7px;height:7px;border-radius:50%;background:#00d68f;box-shadow:0 0 0 0 rgba(0,214,143,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 7px rgba(0,214,143,0)}100%{box-shadow:0 0 0 0 rgba(0,214,143,0)}}
.ui-pane{display:flex;flex-direction:column;gap:16px}
.ui-pane:not(.on){position:absolute;left:0;right:0;top:0;height:0;overflow:hidden;visibility:hidden;pointer-events:none}
.ui-pane.on{animation:fi .28s ease both}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ui-ana{width:100%;height:calc(100vh - 150px);min-height:560px;border:1px solid #202834;border-radius:16px;background:#0a0e14}
.ui-anabar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8b93a1}.ui-anabar a{color:#4d8dff}
@media(max-width:640px){#ui-tabs .rf{display:none}#ui-tabs button{padding:9px 11px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ui-click{cursor:pointer}.ui-click:hover{background:rgba(77,141,255,.08)!important}
.ui-hint{font-size:12px;color:#8b93a1;padding:8px 12px;border:1px dashed #26303f;border-radius:10px;background:rgba(77,141,255,.05)}
#ui-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(4,7,12,.7);backdrop-filter:blur(6px);padding:16px}
#ui-modal.on{display:flex;animation:fi .2s ease both}
#ui-modal .box{width:min(680px,100%);max-height:88vh;overflow:auto;background:#10161f;border:1px solid #2a3547;border-radius:18px;box-shadow:0 30px 80px -20px #000;padding:18px}
#ui-modal h3{margin:0;font-size:17px;color:#fff}#ui-modal .x{float:right;border:0;background:#1a2230;color:#9aa5b5;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:16px}
.tc{margin-top:14px;border:1px solid #202834;border-radius:14px;background:#0d131c;padding:14px}
.tc .hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:#8b93a1}
.bd{padding:2px 9px;border-radius:99px;font-weight:700;font-size:11px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;margin-top:10px}
.gr>div{background:#131b27;border:1px solid #1d2635;border-radius:10px;padding:8px 10px}
.gr small{display:block;color:#8b93a1;font-size:11px}.gr b{font:700 16px 'JetBrains Mono',ui-monospace,monospace}.gr em{font-style:normal;font-size:11px;color:#8b93a1}
.cu{color:#ff5470}.cd{color:#00d68f}.cb{color:#4d8dff}
.lad text{fill:#9aa5b5;font:10px 'JetBrains Mono',ui-monospace,monospace}
.ch-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.ch-bar select{background:#131b27;border:1px solid #26303f;color:#dde3ea;border-radius:9px;padding:6px 8px;font-size:13px}
.ch-seg{display:inline-flex;border:1px solid #26303f;border-radius:9px;overflow:hidden}.ch-seg button,.ch-tg{background:#131b27;border:0;color:#8b93a1;padding:6px 10px;font-size:12px;cursor:pointer;font-weight:600}.ch-seg button.on,.ch-tg.on{background:rgba(77,141,255,.22);color:#fff}
.ch-tg{border:1px solid #26303f;border-radius:9px}.ch-wrap{position:relative;border:1px solid #202834;border-radius:14px;background:#0b1018;overflow:hidden}.ch-wrap canvas{display:block;width:100%;touch-action:pan-y;cursor:crosshair}
.ch-msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#8b93a1;font-size:13px;text-align:center;padding:20px}
.ch-lg{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:#8b93a1}.ch-lg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}

.ui-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}.ui-scroll>table{min-width:100%}
#ui-tabs button .ic{margin-right:6px}
#ui-modal .box{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
@media(max-width:768px){
 body{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))!important;-webkit-text-size-adjust:100%}
 #main-content{padding:0}
 #ui-tabs{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;z-index:40;border-radius:18px 18px 0 0;border-width:1px 0 0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px -12px #000;background:rgba(13,19,28,.92)}
 #ui-tabs .tb{overflow:visible;justify-content:space-between;gap:0}
 #ui-tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:10px;min-width:0;border-radius:12px}
 #ui-tabs button .ic{margin:0;font-size:19px;line-height:1}#ui-tabs button .lb{white-space:nowrap;letter-spacing:0}
 #ui-tabs button.on::after{left:30%;right:30%;top:-7px;bottom:auto}
 .ui-pane{gap:12px}.ui-ana{height:calc(100dvh - 170px);min-height:480px;border-radius:12px}
 .panel,.panel-raised{border-radius:14px!important}
 select,input[type=text],input[type=number],input[type=date]{font-size:16px!important}
 #ui-modal{align-items:flex-end;padding:0}
 #ui-modal .box{width:100%;max-height:92dvh;border-radius:22px 22px 0 0;animation:sheet .26s cubic-bezier(.2,.8,.2,1) both}
 #ui-modal .box::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:#2a3547;margin:-6px auto 12px}
 #ui-modal .x{width:36px;height:36px}.gr{grid-template-columns:repeat(2,1fr)}.gr b{font-size:15px}
 .ch-bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.ch-bar::-webkit-scrollbar{display:none}.ch-bar>*{flex:none}
 .ch-seg button,.ch-tg{padding:10px 13px;font-size:13px}.ch-bar select{padding:9px 8px;max-width:46vw}
 .ch-lg{display:none}
}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@media(pointer:coarse){#ui-tabs button,.ch-seg button,.ch-tg,#ui-modal .x{min-height:40px}.ui-click{-webkit-tap-highlight-color:rgba(77,141,255,.2)}}
@media(min-width:769px){#ui-tabs button .ic{font-size:14px}}
</style>
<script id="ui-v25-js">
(()=>{
const M=document.getElementById('main-content');if(!M||M.dataset.tabs)return;M.dataset.tabs=1;
const hd=M.querySelector('header'),ft=M.querySelector('footer'),kids=[...M.children];
const TABS=[['overview','📊 總覽'],['perf','💰 績效與資金'],['exp','🧪 策略實驗'],['sig','📡 訊號與結算'],['chart','📈 技術線圖'],['ana','🧭 分析中心']];
const pane={};TABS.forEach(([k])=>{const d=document.createElement('div');d.className='ui-pane';d.id='pane-'+k;pane[k]=d});
let cur='overview',first=kids.find(k=>k!==hd);
kids.forEach(k=>{if(k===hd||k===ft)return;const t=(k.textContent||'').trim().slice(0,70);
 if(k.id==='capital-card'||/^正式策略績效|^資金變化/.test(t))cur='perf';
 else if(/^五組策略/.test(t))cur='exp';
 else if(/^即時多空訊號|^今日已平倉/.test(t))cur='sig';
 else if(/^目前持倉/.test(t))cur='overview';
 pane[cur].appendChild(k)});
const bar=document.createElement('nav');bar.id='ui-tabs';
bar.innerHTML='<div class="tb">'+TABS.map(([k,l])=>{const a=l.split(' ');return `<button data-k="${k}"><span class="ic">${a[0]}</span><span class="lb">${a.slice(1).join(' ')}</span></button>`}).join('')+'</div><div class="rf"><i></i><span id="ui-cd">60</span>s</div>';
(hd||M.firstChild).after(bar);TABS.forEach(([k])=>bar.after(pane[k]));
// 分析中心：第一次點開才載入 iframe
const ana=pane.ana;ana.innerHTML='<div class="ui-anabar"><span>績效分析中心（歷史交易、策略模擬器）</span><a href="analytics.html" target="_blank" rel="noopener">在新分頁開啟 ↗</a></div>';
let loaded=false;
function show(k,push){if(!pane[k])k='overview';
 TABS.forEach(([n])=>pane[n].classList.toggle('on',n===k));
 bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 if(k==='ana'&&!loaded){loaded=true;const f=document.createElement('iframe');f.className='ui-ana';f.src='analytics.html';f.title='績效分析中心';ana.appendChild(f)}
 if(push!==false){try{history.replaceState(null,'','#'+k)}catch(e){}}
 try{sessionStorage.setItem('ui-tab',k)}catch(e){}
 window.dispatchEvent(new Event('resize'))}
bar.onclick=e=>{const b=e.target.closest('button');if(b){show(b.dataset.k);scrollTo({top:(window.matchMedia&&matchMedia('(max-width:768px)').matches)?0:Math.max(0,bar.offsetTop-12),behavior:'smooth'})}};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;const i=+e.key-1;if(i>=0&&i<TABS.length)show(TABS[i][0])});
let init=location.hash.slice(1);if(!pane[init]){try{init=sessionStorage.getItem('ui-tab')}catch(e){}}
show(init||'overview',false);
const vp=document.querySelector('meta[name=viewport]');if(vp)vp.setAttribute('content','width=device-width,initial-scale=1,viewport-fit=cover');
const wrapT=()=>M.querySelectorAll('table').forEach(t=>{const p=t.parentElement;if(p.classList.contains('ui-scroll'))return;const o=getComputedStyle(p).overflowX;if(o==='auto'||o==='scroll')return;const w=document.createElement('div');w.className='ui-scroll';p.insertBefore(w,t);w.appendChild(t)});wrapT();
// 頁面每 60 秒自動重整，顯示倒數（重整後仍停留在同一分頁）
let n=60;const cd=document.getElementById('ui-cd');setInterval(()=>{n=n>0?n-1:60;if(cd)cd.textContent=n},1000);
})();
</script>
<script id="ui-v25-trade">
(()=>{
const SEL='#open-position-tbody tr,#settle-tbody tr,#settle-cards .data-card,#analysis-tbody tr,#analysis-cards .data-card',cache={},known=new Set();
const EXR={hit_sl:['停損出場','cd'],hit_tp:['停利出場','cu'],hit_trail:['移動停利','cu'],forced_close:['13:25 強平','cb']};
const fp=v=>v==null||isNaN(v)?'—':(+v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=v=>(v>0?'+':v<0?'−':'')+Math.abs(Math.round(v)).toLocaleString('en-US');
const sym=el=>{const m=(el.textContent||'').match(/\b(\d{4,6}[A-Z]?)\b/);return m&&m[1]};
async function data(){const s=document.getElementById('history-date-select'),d=s&&s.value,td=typeof EXPORT_DATA!=='undefined'?EXPORT_DATA.today_str:'';
 if(!d||d===td)return{date:td,list:EXPORT_DATA.strategy_trades||[],q:EXPORT_DATA.live_quotes||{}};
 if(!cache[d]){try{const j=await (await fetch('history_records/analysis_'+d+'.json')).json();cache[d]={date:d,list:j.strategy_trades||[],q:j.live_quotes||{}}}catch(e){cache[d]={date:d,list:[],q:{}}}}return cache[d]}
function ladder(t,last){const L=t.direction==='做多'?1:-1,pts=[['停損',t.stop_loss,'cd'],['進場',t.entry_price,'cb'],['停利',t.take_profit,'cu']];
 const fs=t.final_stop||t.current_stop;if(t.stop_moved&&fs&&fs!==t.stop_loss)pts.push(['保本/移動停損',fs,'cd']);
 if(t.status==='closed'&&t.exit_price)pts.push(['出場',t.exit_price,'go']);else if(last)pts.push(['現價',last,'go']);
 const v=pts.filter(p=>p[1]!=null).map(p=>({n:p[0],v:+p[1],c:p[2]}));if(v.length<3)return'';
 const lo=Math.min(...v.map(x=>x.v)),hi=Math.max(...v.map(x=>x.v)),pad=(hi-lo)*.08||1,X=q=>30+(q-lo+pad)/(hi-lo+2*pad)*(innerWidth<640?Math.max(280,Math.min(innerWidth-70,460))-60:540),col={cu:'#ff5470',cd:'#00d68f',cb:'#4d8dff',go:'#f5c451'};
 const W=innerWidth<640?Math.max(280,Math.min(innerWidth-70,460)):600;let o=`<svg class="lad" viewBox="0 0 ${W} 110" width="100%"><line x1="30" x2="${W-30}" y1="55" y2="55" stroke="#26303f" stroke-width="3" stroke-linecap="round"/>`;
 const e=X(+t.entry_price),a=X(+t.stop_loss),b=X(+t.take_profit);
 o+=`<rect x="${Math.min(e,a)}" y="51" width="${Math.abs(e-a)}" height="8" rx="3" fill="#00d68f" opacity=".35"/><rect x="${Math.min(e,b)}" y="51" width="${Math.abs(e-b)}" height="8" rx="3" fill="#ff5470" opacity=".35"/>`;
 [...v].sort((x,y)=>x.v-y.v).forEach((p,i)=>{const x=X(p.v),up=i%2===0,y=up?30:92,an=x<60?'start':x>(innerWidth<640?Math.max(280,Math.min(innerWidth-70,460)):600)-60?'end':'middle';
  o+=`<line x1="${x}" x2="${x}" y1="${up?36:60}" y2="${up?50:74}" stroke="${col[p.c]}" stroke-width="2"/><circle cx="${x}" cy="55" r="${p.c==='go'?6:5}" fill="${col[p.c]}"/><text x="${x}" y="${up?y-10:y+4}" text-anchor="${an}" style="fill:${col[p.c]}">${p.n}</text><text x="${x}" y="${up?y+2:y+16}" text-anchor="${an}" style="fill:#dde3ea;font-weight:700">${fp(p.v)}</text>`});
 return o+'</svg>'}
function card(t,q){const L=t.direction==='做多'?1:-1,en=+t.entry_price,sh=+t.shares||0,last=q[t.symbol]&&+q[t.symbol].price,pc=p=>p==null?'':((p-en)/en*100*L>=0?'+':'−')+Math.abs((p-en)/en*100).toFixed(2)+'%',amt=p=>p==null?'':sg((p-en)*L*sh)+' 元（未扣費稅）';
 const open=t.status!=='closed',ex=EXR[t.exit_reason]||['',''],st=open?['持倉中','cb']:ex;
 let pnl='';if(!open&&t.pnl_amount!=null)pnl=`<div><small>淨損益（已扣費稅）</small><b class="${t.pnl_amount>0?'cu':'cd'}">${sg(t.pnl_amount)}</b><em>毛 ${sg(t.pnl_gross)}｜成本 ${Math.round(t.cost_amount||0)}</em></div>`;
 else if(last)pnl=`<div><small>浮動損益（未扣費稅）</small><b class="${(last-en)*L>0?'cu':'cd'}">${sg((last-en)*L*sh)}</b><em>現價 ${fp(last)}</em></div>`;
 const fs=t.final_stop||t.current_stop;
 return `<div class="tc"><div class="hd"><span class="bd" style="background:${L>0?'#2a1017;color:#ff5470':'#06231b;color:#00d68f'}">${t.direction}</span><span class="bd" style="background:#1a2230" ><span class="${st[1]}">${st[0]}</span></span><span>${t.strategy_name||t.strategy||''}</span><span style="margin-left:auto">進場 ${(t.entry_time||'').slice(0,8)}${open?'':'　出場 '+(t.exit_time||'').slice(0,8)}</span></div>
 ${ladder(t,last)}<div class="gr">
 <div><small>🛒 進場價</small><b class="cb">${fp(en)}</b><em>${sh?sh.toLocaleString()+' 股｜約 '+Math.round(en*sh/1000).toLocaleString()+'k 元':''}</em></div>
 <div><small>🛑 停損價</small><b class="cd">${fp(t.stop_loss)}</b><em>${pc(+t.stop_loss)} ${amt(+t.stop_loss)}</em></div>
 <div><small>🎯 停利價</small><b class="cu">${fp(t.take_profit)}</b><em>${pc(+t.take_profit)} ${amt(+t.take_profit)}</em></div>
 ${t.stop_moved&&fs?`<div><small>🔒 保本／移動後停損</small><b class="cd">${fp(fs)}</b><em>已啟動保護</em></div>`:''}
 ${!open&&t.exit_price?`<div><small>出場價</small><b>${fp(t.exit_price)}</b><em>${ex[0]}</em></div>`:''}
 ${pnl}<div><small>預估淨賺賠比</small><b>${t.net_rr!=null?(+t.net_rr).toFixed(2):'—'}</b><em>計畫 RR ${t.plan_rr||'—'}｜停損距離 ${t.risk_pct?(+t.risk_pct).toFixed(2)+'%':'—'}</em></div></div>
 ${t.reason?`<div style="margin-top:10px;font-size:12px;color:#8b93a1;line-height:1.6">📌 進場理由：${t.reason}</div>`:''}</div>`}
const m=document.createElement('div');m.id='ui-modal';document.body.appendChild(m);
const close=()=>m.classList.remove('on');m.onclick=e=>{const c=e.target.closest('[data-chart]');if(c&&window.UIChart){const a=c.dataset.chart.split('|');close();window.UIChart.open(a[0],a[1]);return}if(e.target===m||e.target.closest('.x'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
async function openSym(s,fromAnalysis){const D=await data(),L=D.list.filter(t=>t.symbol===s).sort((a,b)=>(a.entry_time||'')>(b.entry_time||'')?1:-1);
 if(!L.length&&fromAnalysis)return;const nm=L[0]?L[0].name:'';
 m.innerHTML=`<div class="box"><button class="x">✕</button><button class="x" style="width:auto;padding:0 10px;margin-right:8px" data-chart="${s}|${D.date}">📈 看線圖</button><h3>${s} ${nm}　<span style="font-size:12px;color:#8b93a1;font-weight:400">${D.date}｜AI 進場 ${L.length} 筆</span></h3>${L.length?L.map(t=>card(t,D.q)).join(''):'<p style="color:#8b93a1;margin-top:14px">這一天 AI 沒有進場此標的。</p>'}</div>`;m.classList.add('on')}
document.addEventListener('click',e=>{const r=e.target.closest(SEL);if(!r||e.target.closest('a,button,input,select,label'))return;const s=sym(r);if(s)openSym(s,!!r.closest('#analysis-tbody,#analysis-cards'))});
function mark(){document.querySelectorAll(SEL).forEach(r=>{const s=sym(r),a=r.closest('#analysis-tbody,#analysis-cards');if(s&&(!a||known.has(s))){r.classList.add('ui-click');r.title='點擊查看進場價與停利／停損'}})}
function sync(){data().then(D=>{known.clear();D.list.forEach(t=>known.add(t.symbol));mark()})}
let tm;new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(mark,80)}).observe(document.getElementById('main-content'),{childList:true,subtree:true});
document.addEventListener('change',e=>{if(e.target.id==='history-date-select')setTimeout(sync,400)});sync();
['overview','sig'].forEach(k=>{const p=document.getElementById('pane-'+k);if(p){const h=document.createElement('div');h.className='ui-hint';h.textContent='💡 點擊「目前持倉」、「已平倉」或有進場的標的，可查看當天購買價格與停利／停損價位';p.prepend(h)}});
})();
</script>
<script id="ui-v25-chart">
(()=>{
const P=document.getElementById('pane-chart');if(!P)return;
const TD=typeof EXPORT_DATA!=='undefined'?EXPORT_DATA.today_str:'',C={up:'#ff5470',dn:'#00d68f',bl:'#4d8dff',go:'#f5c451',pu:'#b78cff',tx:'#9aa5b5',gd:'#18212e'};
